[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "darya-genie-api"
version = "0.1.0"
description = "FastAPI service for Darya Genie platform: detection, restoration monitoring, and civic-tech river cleanup"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "python-multipart>=0.0.20",
    "rasterio>=1.3.0",
    "numpy>=1.24.0",
    "geopandas>=0.14.0",
    "dask-geopandas>=0.3.0",
    "shapely>=2.0.0",
]

[project.optional-dependencies]
detection = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "ultralytics>=8.0.0",
    "dask-geopandas>=0.3.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "pip-audit>=2.0.0",
    "bandit>=1.7.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
